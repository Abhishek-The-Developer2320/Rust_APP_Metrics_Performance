<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>
<body>

<h1>Edit Task</h1>

<form action="/update/{{ task[0] }}" method="POST">

    <label>Title:</label>
    <input type="text" name="title" value="{{ task[1] }}" required><br><br>

    <label>Description:</label>
    <textarea name="description">{{ task[2] }}</textarea><br><br>

    <button type="submit">Update</button>
</form>

</body>
</html>
